name: Validate PlayLoad

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run examples
      - run: npx prettier examples/gem-survivor.js data/examples.json --write && cat examples/gem-survivor.js && cat data/examples.json
      - uses: actions/upload-artifact@v4
        with:
          name: generated-examples
          path: src/app/examples.js
          if-no-files-found: error
      - run: npm run check
